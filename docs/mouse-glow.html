<canvas id="mouse-trail"></canvas>
<script>
const canvas = document.getElementById('mouse-trail');
const ctx = canvas.getContext('2d');

let points = [];
const maxPoints = 25; // 線の長さ

// マウスの実際の座標
let targetX = window.innerWidth / 2;
let targetY = window.innerHeight / 2;

// 光の先端の座標（これらを滑らかに遅延させます）
let headX = targetX;
let headY = targetY;

let isMoving = false;
let mouseTimeout;

window.addEventListener('resize', resizeCanvas);
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();

window.addEventListener('mousemove', (e) => {
  targetX = e.clientX;
  targetY = e.clientY;
  isMoving = true;
  
  clearTimeout(mouseTimeout);
  // マウスが静止したことを0.05秒後に検知
  mouseTimeout = setTimeout(() => {
    isMoving = false;
  }, 50);
});

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* ==========================================================================
     【数理補間】0.18という係数により、実カーソルへ吸い付くような慣性を生み出す
     ========================================================================== */
  headX += (targetX - headX) * 0.18;
  headY += (targetY - headY) * 0.18;

  const distance = Math.hypot(targetX - headX, targetY - headY);

  // マウスが動いている、または光の先端がまだカーソルに追いついていない場合
  if (isMoving || distance > 0.5) {
    points.push({ x: headX, y: headY });
    if (points.length > maxPoints) {
      points.shift();
    }
  } else {
    // 完全に静止したら、末尾からシュッと流れるように綺麗に消滅させる
    if (points.length > 0) {
      points.shift();
    }
  }

  // 描画処理
  if (points.length > 1) {
    ctx.shadowBlur = 14;          /* ネオンの広がりを少しシャープに調整 */
    ctx.shadowColor = '#00b4d8';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';       /* 曲がり角を完全に丸めてカクつきを抹殺 */

    for (let i = 1; i < points.length; i++) {
      const p1 = points[i - 1];
      const p2 = points[i];
      const ratio = i / points.length;

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);

      // 先端に向かって太く、濃くなる美しい流線形
      ctx.strokeStyle = `rgba(0, 180, 216, ${ratio})`;
      ctx.lineWidth = ratio * 4.5; 

      ctx.stroke();
    }
  }
  requestAnimationFrame(render);
}
render();
</script>
