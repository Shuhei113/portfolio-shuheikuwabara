<canvas id="mouse-trail"></canvas>
<script>
const canvas = document.getElementById('mouse-trail');
const ctx = canvas.getContext('2d');

let points = [];
const maxPoints = 25; // 線の長さ（値を大きくすると残像が長く伸びます）
let mouseX = 0;
let mouseY = 0;
let active = false;

window.addEventListener('resize', resizeCanvas);
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();

window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  active = true;
  
  points.push({ x: mouseX, y: mouseY });
  if (points.length > maxPoints) {
    points.shift();
  }
});

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // マウスが止まっている時は、残像の末尾からシュッと自動消滅させる
  if (!active && points.length > 0) {
    points.shift();
  }
  active = false;

  if (points.length > 1) {
    for (let i = 1; i < points.length; i++) {
      const p1 = points[i - 1];
      const p2 = points[i];
      const ratio = i / points.length; // 先端に近づくほど1に近づく比率

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);

      // 【重要】先端にいくほど太く、明るいシアンブルーにする計算
      ctx.strokeStyle = `rgba(0, 180, 216, ${ratio})`;
      ctx.lineWidth = ratio * 5; // 先端の最大太さ（5ピクセル）
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 鋭い閃光を放つためのネオン効果
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00b4d8';

      ctx.stroke();
    }
  }
  requestAnimationFrame(render);
}
render();
</script>
